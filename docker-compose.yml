version: '3.9'

services:

  api:
    build: .
    container_name: rodbot-api
    command: uvicorn api:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    env_file:
      - .env
    restart: unless-stopped

  telegram:
    build: .
    container_name: rodbot-telegram
    command: python telegram_bot.py
    env_file:
      - .env
    restart: unless-stopped
    depends_on:
      - api
